<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIA TEC - Panel de Administración</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'accent-blue': '#00BFFF',
                        'accent-green': '#7FFF00',
                        'base-dark': '#0a0a0a',
                        'panel-gray': '#1f1f1f',
                        'text-light': '#e5e5e5',
                    },
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        'open-sans': ['Open Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Open Sans', sans-serif;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="bg-base-dark min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-panel-gray p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center">
            <span class="text-2xl font-bold text-accent-blue ml-2">SIA TEC Admin</span>
        </div>
        <div>
            <button id="logout-btn"
                class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition">
                <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-6">

        <!-- Login Section -->
        <section id="login-section" class="flex flex-col items-center justify-center h-[80vh]">
            <div class="bg-panel-gray p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-700">
                <h2 class="text-3xl font-bold text-center mb-8 text-white">Iniciar Sesión</h2>
                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-gray-400 mb-2">Correo Electrónico</label>
                        <input type="email" id="email"
                            class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-accent-blue"
                            placeholder="admin@siatec.com" required>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-2">Contraseña</label>
                        <input type="password" id="password"
                            class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-accent-blue"
                            placeholder="••••••••" required>
                    </div>
                    <button type="submit"
                        class="w-full bg-accent-blue text-white font-bold py-3 rounded-lg hover:bg-opacity-80 transition">
                        <span id="submit-btn-text">Entrar</span>
                    </button>
                    <p id="toggle-auth-mode" class="text-center text-gray-400 mt-4 cursor-pointer hover:text-white">
                        ¿No tienes cuenta? <span class="text-accent-blue font-bold">Regístrate</span>
                    </p>
                    <p id="login-error" class="text-red-500 text-center hidden mt-4"></p>
                </form>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold">Gestión de Productos</h2>
                <div class="flex gap-4">
                    <button id="migrate-btn"
                        class="bg-yellow-600 hover:bg-yellow-700 text-white px-6 py-3 rounded-full font-bold transition">
                        <i class="fas fa-database mr-2"></i> Migrar Datos
                    </button>
                    <button id="add-product-btn"
                        class="bg-accent-green text-base-dark px-6 py-3 rounded-full font-bold hover:bg-opacity-80 transition">
                        <i class="fas fa-plus mr-2"></i> Nuevo Producto
                    </button>
                </div>
            </div>

            <!-- Products List -->
            <div class="bg-panel-gray rounded-xl shadow-lg overflow-hidden border border-gray-700">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-800 text-gray-400 uppercase text-sm">
                            <tr>
                                <th class="p-4">Imagen</th>
                                <th class="p-4">Nombre</th>
                                <th class="p-4">Precio</th>
                                <th class="p-4">Oferta</th>
                                <th class="p-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-gray-700">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50">
        <div class="bg-panel-gray p-8 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-gray-600">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-2xl font-bold text-white">Nuevo Producto</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>

            <form id="product-form" class="space-y-4">
                <input type="hidden" id="product-id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">Nombre</label>
                        <input type="text" id="p-name"
                            class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none"
                            required>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Precio Actual ($)</label>
                        <input type="number" id="p-price"
                            class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none"
                            required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">Precio Original ($) (Opcional)</label>
                        <input type="number" id="p-original-price"
                            class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Stock</label>
                        <input type="number" id="p-stock"
                            class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none"
                            value="1">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1">Descripción (HTML permitido)</label>
                    <textarea id="p-description"
                        class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white h-32 focus:border-accent-blue focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1">URL Imagen Principal</label>
                    <input type="url" id="p-image"
                        class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none"
                        required>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1">URLs Imágenes Adicionales (Separadas por coma)</label>
                    <input type="text" id="p-images"
                        class="w-full bg-base-dark border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none">
                </div>

                <div class="flex items-center gap-4 py-2">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="p-offer"
                            class="form-checkbox h-5 w-5 text-accent-blue bg-base-dark border-gray-600 rounded focus:ring-accent-blue">
                        <span class="ml-2 text-white">En Oferta</span>
                    </label>
                    <input type="text" id="p-discount" placeholder="Ej: 10%"
                        class="bg-base-dark border border-gray-600 rounded-lg p-2 text-white w-24 hidden">
                </div>

                <button type="submit"
                    class="w-full bg-accent-blue text-white font-bold py-3 rounded-lg hover:bg-opacity-90 transition mt-4">
                    Guardar Producto
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
